# Code scanning. Results go to the Security tab; a new high-severity alert on a PR shows up as a failed "CodeQL" check.
name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # On main a scan always finishes: merges closer together than one Swift scan would otherwise cancel every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
            timeout: 10
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
            timeout: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # Swift takes ~16 minutes, so it scans main after every merge and weekly instead of gating each PR.
  # The CodeQL tracer fails on the xcode-27 image ("Bad CPU type" spawning the manifest), so Swift is scanned with
  # the macos-26 image's default Xcode, on which the core suite also builds.
  analyze-swift:
    name: CodeQL (swift)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      # The shipped code only: BiselCore holds the crypto, key handling and sync, BiselCloudKit the iCloud lane, and the app target
      # adds UI on top. No SoftwareKeys trait and no test support, which never ship.
      - name: Build BiselCore
        working-directory: apps/mac/Packages/BiselCore
        run: |
          swift build --target BiselCore --disable-sandbox
          swift build --target BiselCloudKit --disable-sandbox

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
