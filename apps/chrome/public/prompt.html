<!doctype html>
<html lang="en">

    <title>Bisel</title>

      :root {
        color-scheme: light dark;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
        background: Canvas;
        color: CanvasText;
