# XcodeGen spec for the Bisel Mac app (SPEC.md §3, §8, §10).
# Generate with:  cd apple && xcodegen generate
# Never hand-edit Bisel.xcodeproj (it is generated and git-ignored).
name: Bisel

options:
  bundleIdPrefix: app.bisel
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Apple Development signing (team ZVGTVNUPVA, paid Individual) so the Secure Enclave and Touch ID paths run.
    # project.dev.yml overrides this back to ad-hoc for the software-key build.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ZVGTVNUPVA
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode drops --options runtime when the identity is ad-hoc ("-"); force it so dev builds run with the
    # same hardened-runtime restrictions as the Developer ID build will.
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"
  configs:
    Debug:
      ENABLE_USER_SCRIPT_SANDBOXING: NO   # the Debug-only ATS phase edits the built Info.plist
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG BISEL_DEV_FIXTURE"
      # The preview debug dylib is ad-hoc signed separately and fails hardened-runtime library validation
      # (different "team"), so the app would not launch. Link everything into the executable instead.
      ENABLE_DEBUG_DYLIB: NO
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      # Xcode otherwise injects com.apple.security.get-task-allow into ad-hoc / development signed builds, which lets any
      # same-user process attach to the app and read VK (security review H4). The gate below fails the build if it is there.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  FuzzyMatch:
    url: https://github.com/ordo-one/FuzzyMatch
    exactVersion: 1.4.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  SwiftCSV:
    url: https://github.com/swiftcsv/SwiftCSV
    exactVersion: 0.10.0
  # Production wiring: NO SoftwareKeys trait, so the software key store is not compiled in (SPEC §4/§8).
  # Debug runs on an unsigned build use project.dev.yml (-> BiselDev.xcodeproj), which enables the trait.
  BiselCore:
    path: Packages/BiselCore

targets:
  Bisel:
    type: application
    platform: macOS
    sources:
      - path: Bisel
        excludes:
          - "FillHarness/**"
          - "UITests/**"
          - "Resources/FigmaIcons/**"  # source SVGs; the asset catalog holds the compiled copies
    dependencies:
      - package: KeyboardShortcuts
      - package: FuzzyMatch
      - package: ZIPFoundation
      - package: SwiftCSV
      - package: BiselCore
        product: BiselCore
    postBuildScripts:
      - name: "Release gate: no get-task-allow"
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
          if [ "$CONFIGURATION" = "Release" ]; then
            xcent="$TARGET_TEMP_DIR/$PRODUCT_NAME.app.xcent"
            if [ -f "$xcent" ] && grep -q "get-task-allow" "$xcent"; then
              echo "error: get-task-allow is in the Release entitlements ($xcent). A debugger could read the vault key." >&2
              exit 1
            fi
          fi
    entitlements:
      path: Bisel/Bisel.entitlements
      # Deliberately NO com.apple.security.app-sandbox: Accessibility fill needs an
      # unsandboxed process (SPEC.md §8). Hardened runtime is on; no exceptions needed.
      properties: {}
    info:
      path: Bisel/Info.plist
      properties:
        CFBundleDisplayName: Bisel
        CFBundleName: Bisel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Personal use."
        NSAppleEventsUsageDescription: "Bisel does not script other apps."
        NSFaceIDUsageDescription: "Bisel uses Touch ID to unlock your vault."
        # No ATS exception here: Release is https-only. Debug builds get NSAllowsLocalNetworking from the build phase below so the
        # local dev server (http://localhost) works (security review L13).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bisel.mac
        PRODUCT_NAME: Bisel
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  # Tiny native SwiftUI app with username / password / code fields: the "native SwiftUI app"
  # row of the fill matrix and the target for the XCUITest flow. Never shipped.
  BiselFillHarness:
    type: application
    platform: macOS
    sources:
      - path: Bisel/FillHarness
    entitlements:
      path: Bisel/FillHarness/FillHarness.entitlements
      properties: {}
    info:
      path: Bisel/FillHarness/Info.plist
      properties:
        CFBundleDisplayName: Bisel Fill Harness
        CFBundleName: BiselFillHarness
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bisel.mac.fillharness
        PRODUCT_NAME: BiselFillHarness
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES

  BiselUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Bisel/UITests
    dependencies:
      - target: Bisel
      - target: BiselFillHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bisel.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bisel
        # The ad-hoc signed test bundle must load into Xcode's runner: no hardened runtime / library validation here.
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""

schemes:
  Bisel:
    build:
      targets:
        Bisel: all
        BiselFillHarness: [run]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BiselUITests
    archive:
      config: Release
